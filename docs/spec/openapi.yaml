    SurveyWriteRequest:
      type: object
      additionalProperties: false
      required:
      - surveyVersion
      - answers
      properties:
        surveyVersion:
          type: string
          enum:
          - v1
        answers:
          $ref: '#/components/schemas/SurveyAnswers'
    SurveySkipRequest:
      type: object
      additionalProperties: false
      required:
      - surveyVersion
      properties:
        surveyVersion:
          type: string
          enum:
          - v1
    SurveyResponse:
      type: object
      additionalProperties: false
      required:
      - reservationId
      - surveyVersion
      - jobFamily
      - applicantType
      - primaryRole
      - status
      - answers
      - startedAt
      - completedAt
      - skippedAt
      - updatedAt
      properties:
        reservationId:
          type: string
          format: uuid
        surveyVersion:
          type: string
          enum:
          - v1
        jobFamily:
          type: string
          enum:
          - FE
          - BE
          - AI
          description: S-0.1 → reservations.job_family
        applicantType:
          type: string
          enum:
          - student
          - entry_level
          - experienced
          - employed_no_change
          - other
          description: x-1.1 → reservations.applicant_type
        primaryRole:
          type: string
          enum:
          - web_frontend
          - mobile_cross_platform
          - design_system
          - performance_platform
          - interactive_graphics
          - undecided
          - other
          - server_api
          - distributed_systems
          - data_engineering
          - devops_sre
          - llm_genai
          - cv_multimodal
          - nlp_speech
          - recommendation_search
          - mlops_platform
          - robotics_edge
          - ml_engineer
          - research_engineer
          description: x-2.1 → reservations.primary_role. 직군별 허용 조합은 survey-contract.md §2를 서버에서 검증한다.
        status:
          type: string
          enum:
          - not_started
          - in_progress
          - completed
          - skipped
        answers:
          $ref: '#/components/schemas/SurveyAnswers'
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: 서버 시각(UTC)
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 서버 시각(UTC)
        skippedAt:
          type: string
          format: date-time
          nullable: true
          description: 서버 시각(UTC)
        updatedAt:
          type: string
          format: date-time
          nullable: false
          description: 서버 시각(UTC)

    DailyFunnelRow:
      type: object
      properties:
        day:
          type: string
          format: date
          example: "2026-09-29"
        uniqueVisitors:
          type: integer
          format: int64
        sessions:
          type: integer
          format: int64
        reservingVisitors:
          type: integer
          format: int64
        reservations:
          type: integer
          format: int64
        visitorConversionRate:
          type: number
          format: double
          description: "reservingVisitors / uniqueVisitors * 100 (소수점 2자리)"
          example: 15.00

    UtmParams:
      type: object
      nullable: true
      properties:
        source:
          type: string
          nullable: true
        medium:
          type: string
          nullable: true
        campaign:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        term:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHORIZED
            - DUPLICATE_EMAIL
            - INTERNAL_ERROR
            - NOT_FOUND
            - SURVEY_COMPLETED
            - SURVEY_VERSION_MISMATCH
            - SURVEY_NOT_AVAILABLE

  responses:
    InvalidRequest:
      description: 요청 유효성 검사 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "INVALID_REQUEST"

    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "UNAUTHORIZED"

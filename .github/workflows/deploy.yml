name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-api:
    # Set only after applying 202610120001_add_stage1_survey.sql (see deployment runbook).
    if: ${{ vars.SURVEY_STAGE1_DB_READY == 'true' && startsWith(vars.LANDING_API_URL, 'https://') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          platforms: linux/arm64
          push: true
          tags: mjin2/weiver-landing-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to OCI
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/weiver
            docker compose pull
            docker compose up -d
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
              sleep 2
            done
            exit 1

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:web
        env:
          VITE_API_URL: ${{ vars.LANDING_API_URL }}

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "apps/web/dist/*"
          target: "/tmp/weiver-dist"
          strip_components: 3

      - name: Move to web root
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: sudo cp -r /tmp/weiver-dist/* /var/www/weiver/
